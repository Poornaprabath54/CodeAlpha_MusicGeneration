<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI FAQ Chatbot</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body>
<nav class="navbar"><a href="/" class="brand">CODEALPHA AI SUITE</a></nav>
<main class="container"><section class="glass-card">
<h1>💬 AI FAQ Chatbot</h1><p class="muted">Ask questions about AI and computer science.</p>
<div id="chat" class="chat-window"><div class="chat-bubble bot">Hello! Ask me an AI or computer-science question.</div></div>
<div class="chat-input"><input id="message" placeholder="Type your question..." autocomplete="off"><button class="btn" id="sendBtn">Send</button></div>
<button class="btn secondary" id="clearChat">Clear Chat</button>
<a class="back" href="/">← Back to dashboard</a>
</section></main>
<script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
</body></html>
